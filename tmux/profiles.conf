# Tmux Profiles Configuration
# This file defines profiles that automatically start when tmux launches

# Profile 1: Development
new-session -d -s 'dev' -c '$HOME/dotfiles'
split-window -h -t 'dev' -c '$HOME/dotfiles'
split-window -v -t 'dev:0.1' -c '$HOME/dotfiles'
select-pane -t 'dev:0.0'
send-keys -t 'dev:0.0' 'nvim' Enter
send-keys -t 'dev:0.1' 'git status' Enter
send-keys -t 'dev:0.2' 'clear' Enter

# Profile 2: System Monitor
new-session -d -s 'monitor' -c '~'
split-window -h -t 'monitor'
split-window -v -t 'monitor:0.0'
split-window -v -t 'monitor:0.2'
send-keys -t 'monitor:0.0' 'htop' Enter
send-keys -t 'monitor:0.1' 'btop' Enter  
send-keys -t 'monitor:0.2' 'iostat 2' Enter
send-keys -t 'monitor:0.3' 'df -h' Enter

# Profile 3: Terminal
new-session -d -s 'terminal' -c '~'
split-window -h -t 'terminal'
send-keys -t 'terminal:0.0' 'clear' Enter
send-keys -t 'terminal:0.1' 'clear' Enter

# Profile 4: Logs
new-session -d -s 'logs' -c '/var/log'
split-window -v -t 'logs'
send-keys -t 'logs:0.0' 'tail -f /var/log/system.log 2>/dev/null || echo "No system.log available"' Enter
send-keys -t 'logs:0.1' 'clear && echo "Logs session ready"' Enter

# Set the default session to 'dev'
attach-session -t 'dev'