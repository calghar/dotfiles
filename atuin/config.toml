# Atuin Configuration
# https://docs.atuin.sh/configuration/config/

# Search mode: "prefix", "fulltext", "fuzzy", "skim", or "daemon-fuzzy"
search_mode = "fuzzy"

# Filter mode: "global", "host", "session", "directory", "workspace"
filter_mode = "global"

# Style: "auto", "compact", "full"
style = "auto"

# Inline height for search UI
inline_height = 10

# Show preview of selected command
show_preview = true

# Show help row with version and keymap hints
show_help = true

# Immediately execute on enter (tab to edit first)
enter_accept = true

# Keymap mode: "emacs", "vim-normal", "vim-insert", "auto"
keymap_mode = "auto"

# Don't store commands that look like secrets
secrets_filter = true

# Store commands that failed
store_failed = true

# Don't check for updates (managed by brew)
update_check = false

# History filter: exclude commands matching these patterns
history_filter = [
    "^exit$",
]

[keys]
scroll_exits = true

[stats]
common_subcommands = [
    "cargo",
    "docker",
    "git",
    "go",
    "kubectl",
    "npm",
    "pnpm",
    "yarn",
    "brew",
]
common_prefix = ["sudo"]