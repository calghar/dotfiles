# Atuin Configuration
# Enhanced shell history management
# https://github.com/atuinsh/atuin

## Database settings
[database]
# Use SQLite for local storage
dialect = "sqlite"
path = "~/.local/share/atuin/history.db"

## History settings
[history]
# Enable fuzzy search
fuzzy = true

# Show times in history
show_time = true

# Show exit codes
show_exit = true

# Maximum number of commands to keep in history
max_entries = 100000

# Enable inline suggestions
inline_height = 10

# Sync settings (set to false for local-only usage)
sync_enabled = false

## Search settings
[search]
# Search mode: "prefix", "fulltext", or "fuzzy"
search_mode = "fuzzy"

# Filter mode
filter_mode = "global"

# Show preview of command
show_preview = true

# Enable word jump mode
word_jump_mode = "emacs"

## Key bindings
[keys]
# Use ctrl-r for search (default)
search = "ctrl-r"

# Use up arrow for prefix search
up = "prefix"

## UI settings
[ui]
# Style options: "auto", "compact", "full"
style = "auto"

# Show help text
show_help = true

# Use different colors for different exit codes
exit_code_colors = true

## Privacy settings
[privacy]
# Don't record commands that start with a space
leading_whitespace = "ignore"

# Don't record common commands
common_prefix = [
    "ls",
    "cd",
    "pwd",
    "clear",
    "exit",
    "history"
]

## Update settings
[update]
# Check for updates
check_interval = "7d"